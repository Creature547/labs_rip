<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Плитка</title>
    <link rel="stylesheet" href="/static/styles/heating_style.css?v=4">
</head>

<body>
    <div class="app-viewport">
        <div class="app-content">
            <div class="grid-container">

                <!-- Поиск / Фильтр по минимальной мощности -->
                <form action="/grid" method="GET" class="search-bar">
                    <input 
                        type="number" 
                        name="min_power" 
                        class="search-input" 
                        placeholder="Мин. мощность, кВт"
                        value="{{ .min_power }}">
                    <button type="submit" class="search-btn">Найти</button>
                </form>

                <!-- Сетка карточек 2x2 -->
                <div class="card-grid">
                    {{ range .items }}
                    <div class="card-item" style="background-image: url('{{ .ImageURL }}');">
                        <div class="card-overlay">
                            <div class="card-item-title">{{ .Title }}</div>
                            <div class="card-item-sub">{{ .Power }} кВт · {{ .Cost }} ₽</div>
                            <div class="card-item-likes">❤️ {{ len .Likes }}</div>
                        </div>
                    </div>
                    {{ end }}
                </div>

            </div>
        </div>

        <!-- Нижний таббар -->
        <nav class="bottom-nav">
            <a href="/feed" class="nav-item">Лента</a>
            <a href="/draft" class="nav-item">Добавление</a>
            <a href="/grid" class="nav-item active">Плитка</a>
        </nav>
    </div>
</body>

</html>
