<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Плитка</title>
    <link rel="stylesheet" href="/static/styles/heating_style.css?v=12">
</head>
<body>
<div class="app-viewport">
    <div class="app-content">
        <div class="grid-container">
            <form action="/grid" method="GET" class="search-bar">
                <input type="number" step="0.1" min="0" name="min_power" class="search-input"
                       placeholder="Мин. мощность, кВт" value="{{ .min_power }}">
                <button type="submit" class="search-btn">Найти</button>
            </form>

            <div class="card-grid">
                {{ range .items }}
                <div class="card-wrap">
                    <a href="/feed?id={{ .ID }}" class="card-item" style="background-image: url('{{ .ImageURL }}');">
                        <div class="card-overlay">
                            <div class="card-item-title">{{ .Title }}</div>
                            <div class="card-item-sub">{{ .Power }} кВт · {{ .Cost }} ₽</div>
                            <div class="card-item-likes">❤️ {{ len .Likes }}</div>
                        </div>
                    </a>
                    <form action="/heating/delete" method="POST" class="delete-card-form">
                        <input type="hidden" name="id" value="{{ .ID }}">
                        <button type="submit" class="delete-card-btn">Удалить</button>
                    </form>
                </div>
                {{ end }}
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/feed" class="nav-item">Лента</a>
        <a href="/draft" class="nav-item">Добавление</a>
        <a href="/grid" class="nav-item active">Плитка</a>
    </nav>
</div>
</body>
</html>
