<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление расчета</title>
    <link rel="stylesheet" href="/static/styles/heating_style.css?v=13">
</head>
<body>
<div class="app-viewport">
    <div class="app-content">
        <div class="form-container">
            {{ if .has_draft }}
            <div class="form-header">Добавить расчет (Черновик)</div>

            <form action="/draft/publish" method="POST" class="calculation-form">
                <input type="hidden" name="id" value="{{ .draft.ID }}">

                <div class="form-section-title">МЕДИА</div>
                <div class="form-group">
                    <label>Ссылка на изображение</label>
                    <input type="url" value="{{ .draft.ImageURL }}" readonly>
                </div>
                <div class="form-group">
                    <label>Ссылка на видео</label>
                    <input type="url" value="{{ .draft.VideoURL }}" readonly>
                </div>

                <div class="form-section-title">ПАРАМЕТРЫ УСТРОЙСТВА</div>
                <div class="form-group">
                    <label>Название устройства</label>
                    <input type="text" value="{{ .draft.Title }}" readonly>
                </div>

                <div class="two-col-inputs">
                    <div class="form-group">
                        <label>Мощность, кВт</label>
                        <input name="power" type="number" step="0.1" min="0.1"
                               placeholder="0" value="{{ .draft.Power }}" required>
                    </div>
                    <div class="form-group">
                        <label>Стоимость, ₽</label>
                        <input name="cost" type="number" step="0.01" min="0.01"
                               placeholder="0" value="{{ .draft.Cost }}" required>
                    </div>
                </div>

                <div class="form-section-title">ПАРАМЕТРЫ ПОМЕЩЕНИЯ</div>
                <div class="two-col-inputs">
                    <div class="form-group">
                        <label>Площадь, м²</label>
                        <input name="area" type="number" step="0.1" min="0.1"
                               placeholder="0" value="{{ .draft.Area }}" required>
                    </div>
                    <div class="form-group">
                        <label>Высота потолков, м</label>
                        <input name="ceiling_height" type="number" step="0.1" min="0.1"
                               value="{{ .draft.CeilingHeight }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Этажность</label>
                    <div class="floor-toggle">
                        <label class="floor-option">
                            <input type="radio" name="floor_type" value="1 этаж"
                                   {{ if eq .draft.FloorType "1 этаж" }}checked{{ end }} required>
                            <span>1 этаж</span>
                        </label>
                        <label class="floor-option">
                            <input type="radio" name="floor_type" value="Средний"
                                   {{ if eq .draft.FloorType "Средний" }}checked{{ end }}>
                            <span>Средний</span>
                        </label>
                        <label class="floor-option">
                            <input type="radio" name="floor_type" value="Последний"
                                   {{ if eq .draft.FloorType "Последний" }}checked{{ end }}>
                            <span>Последний</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Материал стен</label>
                    <select name="wall_material" required>
                        <option value="Газобетонный блок" {{ if eq .draft.WallMaterial "Газобетонный блок" }}selected{{ end }}>Газобетонный блок</option>
                        <option value="Кирпич" {{ if eq .draft.WallMaterial "Кирпич" }}selected{{ end }}>Кирпич</option>
                        <option value="Дерево" {{ if eq .draft.WallMaterial "Дерево" }}selected{{ end }}>Дерево</option>
                        <option value="Монолитный бетон" {{ if eq .draft.WallMaterial "Монолитный бетон" }}selected{{ end }}>Монолитный бетон</option>
                        <option value="Каркасные стены" {{ if eq .draft.WallMaterial "Каркасные стены" }}selected{{ end }}>Каркасные стены</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Желаемая температура в доме, °C</label>
                    <input name="desired_temperature" type="number" step="0.5" min="1"
                           value="{{ .draft.DesiredTemperature }}" required>
                </div>

                <div class="form-section-title">ТАРИФ</div>
                <div class="form-group">
                    <label>Стоимость электроэнергии, ₽/кВт·ч</label>
                    <input name="electricity_tariff" type="number" step="0.01" min="0.01"
                           value="{{ .draft.ElectricityTariff }}" required>
                </div>

                <div class="form-section-title">КРАТКАЯ ИНФОРМАЦИЯ</div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea name="description" rows="4"
                              placeholder="Кратко опишите устройство и особенности расчета"
                              required>{{ .draft.Description }}</textarea>
                </div>

                <button type="submit" class="primary-form-btn">Опубликовать</button>
            </form>

            {{ else }}
            <div class="form-header">Добавить расчет (Черновик)</div>

            <form action="/draft/create" method="POST" class="calculation-form">
                <div class="form-section-title">МЕДИА</div>
                <div class="form-group">
                    <label>Ссылка на изображение</label>
                    <input name="image_url" type="url"
                           placeholder="http://127.0.0.1:9000/heating/image.png" required>
                </div>
                <div class="form-group">
                    <label>Ссылка на видео</label>
                    <input name="video_url" type="url"
                           placeholder="http://127.0.0.1:9000/heating/video.mp4" required>
                </div>

                <div class="form-section-title">ПАРАМЕТРЫ УСТРОЙСТВА</div>
                <div class="form-group">
                    <label>Название устройства</label>
                    <input name="title" type="text" placeholder="например, Печь-камин" required>
                </div>

                <div class="two-col-inputs">
                    <div class="form-group">
                        <label>Мощность, кВт</label>
                        <input name="power" type="number" step="0.1" min="0.1"
                               placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>Стоимость, ₽</label>
                        <input name="cost" type="number" step="0.01" min="0.01"
                               placeholder="0" required>
                    </div>
                </div>

                <div class="form-section-title">ПАРАМЕТРЫ ПОМЕЩЕНИЯ</div>
                <div class="two-col-inputs">
                    <div class="form-group">
                        <label>Площадь, м²</label>
                        <input name="area" type="number" step="0.1" min="0.1"
                               placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>Высота потолков, м</label>
                        <input name="ceiling_height" type="number" step="0.1" min="0.1"
                               value="2.7" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Этажность</label>
                    <div class="floor-toggle">
                        <label class="floor-option">
                            <input type="radio" name="floor_type" value="1 этаж" checked required>
                            <span>1 этаж</span>
                        </label>
                        <label class="floor-option">
                            <input type="radio" name="floor_type" value="Средний">
                            <span>Средний</span>
                        </label>
                        <label class="floor-option">
                            <input type="radio" name="floor_type" value="Последний">
                            <span>Последний</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Материал стен</label>
                    <select name="wall_material" required>
                        <option value="Газобетонный блок">Газобетонный блок</option>
                        <option value="Кирпич">Кирпич</option>
                        <option value="Дерево">Дерево</option>
                        <option value="Монолитный бетон">Монолитный бетон</option>
                        <option value="Каркасные стены">Каркасные стены</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Желаемая температура в доме, °C</label>
                    <input name="desired_temperature" type="number" step="0.5" min="1"
                           value="22" required>
                </div>

                <div class="form-section-title">ТАРИФ</div>
                <div class="form-group">
                    <label>Стоимость электроэнергии, ₽/кВт·ч</label>
                    <input name="electricity_tariff" type="number" step="0.01" min="0.01"
                           value="5.50" required>
                </div>

                <div class="form-section-title">КРАТКАЯ ИНФОРМАЦИЯ</div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea name="description" rows="4"
                              placeholder="Кратко опишите устройство и особенности расчета"
                              required></textarea>
                </div>

                <button type="submit" class="primary-form-btn">Далее</button>
            </form>
            {{ end }}
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/feed" class="nav-item">Лента</a>
        <a href="/draft" class="nav-item active">Добавление</a>
        <a href="/grid" class="nav-item">Плитка</a>
    </nav>
</div>
</body>
</html>
