<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лента отопительного оборудования</title>
    <link rel="stylesheet" href="/static/styles/heating_style.css?v=20">
</head>
<body>
<div class="app-viewport">
    <div class="app-content">
        <div class="feed-container">
            <video class="feed-video"
                   autoplay loop muted playsinline
                   style="background-image: url('{{ .equipment.ImageURL }}'), url('{{ .default_image }}');">
                <source src="{{ .equipment.VideoURL }}" type="video/mp4">
            </video>

            <div class="feed-overlay">
                <div class="feed-title">{{ .equipment.Name }}</div>

                <div class="feed-bottom-row">
                    <div class="feed-bottom-left">
                        <div class="params-grid">
                            <div><strong>Мощность</strong>{{ .equipment.Power }} кВт</div>
                            <div><strong>Стоимость</strong>{{ .equipment.Cost }} ₽</div>
                        </div>

                        <details class="description-details">
                            <summary>
                                <span class="description-preview">{{ with .equipment.Description }}{{ . }}{{ end }}</span>
                                <span class="more-text">ещё</span>
                            </summary>
                            <div class="description-full">{{ with .equipment.Description }}{{ . }}{{ end }}</div>
                        </details>
                    </div>

                    <div class="feed-side-actions">
                        <span class="like-badge">❤️ {{ .likes_count }}</span>
                        <a href="/feed?id={{ .equipment.ID }}&next=true" class="btn-next-arrow" title="Следующий">&#10140;</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/feed" class="nav-item active">Лента</a>
        <a href="/draft" class="nav-item">Добавление</a>
        <a href="/grid" class="nav-item">Плитка</a>
    </nav>
</div>
</body>
</html>
